name: Citation export — non-regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  citation-tests:
    name: Run citation export tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run citation non-regression tests
        run: |
          bunx vitest run \
            src/components/assistant/__tests__/citationExportFixtures.test.ts \
            src/components/assistant/__tests__/citationRefs.test.ts \
            --reporter=verbose

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: citation-tests-failure-logs
          path: |
            **/*.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
