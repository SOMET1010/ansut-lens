name: Citation export — non-regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  citation-tests:
    name: Run citation export tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run citation non-regression tests (Vitest)
        run: |
          bunx vitest run \
            src/components/assistant/__tests__/citationExportFixtures.test.ts \
            src/components/assistant/__tests__/citationRefs.test.ts \
            --reporter=verbose

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Run citation E2E tests (Playwright)
        run: bunx playwright test e2e/citations-broken.spec.ts --reporter=list

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: citation-tests-failure-logs
          path: |
            **/*.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  citations-vitest-all:
    name: Run all citation Vitest suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run all citation-related Vitest suites
        id: vitest
        run: |
          mkdir -p test-results
          bunx vitest run \
            src/components/assistant/__tests__/citationExportFixtures.test.ts \
            src/components/assistant/__tests__/citationRefs.test.ts \
            src/components/assistant/__tests__/citationUrlIntegrity.test.ts \
            src/components/assistant/__tests__/citationAppendix.test.ts \
            src/components/assistant/__tests__/CitationsPreview.test.tsx \
            --reporter=verbose \
            --reporter=json --outputFile=test-results/citations-vitest.json

      - name: Build broken citations summary
        if: failure() && github.event_name == 'pull_request'
        id: summary
        run: |
          node .github/scripts/citations-failure-summary.mjs \
            test-results/citations-vitest.json > test-results/comment.md || true
          echo "has_comment=$( [ -s test-results/comment.md ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request' && steps.summary.outputs.has_comment == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test-results/comment.md', 'utf8');
            const marker = '<!-- citations-tests-failure -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }

      - name: Upload Vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: citations-vitest-all-failure-logs
          path: |
            **/*.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
